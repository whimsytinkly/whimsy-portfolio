<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Little About Me</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">

    <!-- styles -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/about.css">
</head>

<body>

    <!-- About page content goes here -->
    <!-- Background -->
    <div id="starfield" aria-hidden="true"></div>
    <div class="shooting-star" aria-hidden="true"></div>

    <!-- Website -->
    <div class="site-wrapper">

        <!-- Navigation -->
        <header class="site-header">
            <nav class="main-nav" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="projects.html">Projects</a>
                <span class="nav-divider" aria-hidden="true"></span>

                <div class="nav-socials">
                    <a href="mailto:whimsytinkly@gmail.com" aria-label="Email me" title="Say hello!">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="5" width="18" height="14" rx="2" />
                            <path d="m3 7 9 6 9-6" />
                        </svg>
                    </a>

                    <a href="https://github.com/whimsytinkly" target="_blank" rel="noopener noreferrer"
                        aria-label="GitHub" title="Explore my GitHub">
                        <svg viewBox="-1 -1 28 28" width="21" height="21" fill="currentColor" aria-hidden="true">
                            <path
                                d="M12 .8a11.2 11.2 0 0 0-3.54 21.82c.56.1.76-.24.76-.54v-2.1c-3.1.68-3.76-1.32-3.76-1.32-.5-1.3-1.24-1.64-1.24-1.64-1.02-.7.08-.68.08-.68 1.12.08 1.7 1.16 1.7 1.16 1 .1.76 2.04 3.02 2.04.7 0 1.24-.24 1.58-.56.1-.7.38-1.18.68-1.46-2.48-.28-5.08-1.24-5.08-5.52 0-1.22.44-2.22 1.16-3-.12-.28-.5-1.42.12-2.96 0 0 .94-.3 3.08 1.14a10.7 10.7 0 0 1 5.6 0c2.14-1.44 3.08-1.14 3.08-1.14.62 1.54.24 2.68.12 2.96.72.78 1.16 1.78 1.16 3 0 4.3-2.6 5.24-5.1 5.52.4.34.76 1 .76 2.02v3.02c0 .3.2.66.76.54A11.2 11.2 0 0 0 12 .8Z" />
                        </svg>
                    </a>
                </div>
            </nav>
        </header>

        <!-- Main content -->
        <main>
            <img class="companion" src="assets/images/companion64.gif" alt="" />
            <section class="about-section">

                <div class="about-layout">

                    <!-- Left column -->
                    <div class="about-left">

                        <!-- Avatar + introduction -->
                        <section class="about-intro">

                            <div class="about-avatar">
                                <img src="assets/images/companion512.gif" alt="My little Mimikyu-inspired avatar">
                            </div>

                            <div class="about-intro-text">
                                <h2>Hi there!</h2>
                                <!-- Introduction goes here -->
                                <p>WhimsyTinkly here! </p>
                                <p>A software engineer who enjoys exploring ideas, solving little mysteries, and turning
                                    'what if?' into something real.
                                </p>
                            </div>

                        </section>

                        <!-- Into My Mind -->
                        <section class="about-mind">
                            <h2>So, what's on my mind?</h2>

                            <div class="mind-grid" id="mind-grid">
                                <!-- Cards will be generated from aboutConstants.js -->
                            </div>
                        </section>

                    </div>

                    <!-- Right column -->
                    <div class="about-right">

                        <!-- My Journey + Tech Galaxy -->
                        <section class="about-journey">
                            <h2>My Journey</h2>

                            <!-- Chapter selector -->
                            <div class="journey-timeline" id="journey-timeline">
                            </div>

                            <!-- Chapter content -->
                            <div class="journey-card" id="journey-card">
                                <div class="journey-card-content" id="journey-card-content">
                                    <span class="journey-year" id="journey-year"></span>
                                    <h3 id="journey-title"></h3>
                                    <p id="journey-description"></p>
                                    <p class="journey-quote" id="journey-quote"></p>
                                </div>
                            </div>

                            <!-- Navigation -->
                            <div class="journey-navigation">
                                <button type="button" id="journey-prev" aria-label="Previous chapter">
                                    ← Previous
                                </button>
                                <button type="button" id="journey-next" aria-label="Next chapter">
                                    Next →
                                </button>
                            </div>

                            <!-- Technology galaxy -->
                            <div class="tech-galaxy" id="tech-galaxy">
                            </div>
                        </section>

                    </div>

                </div>

            </section>


        </main>

        <!-- Footer -->
        <footer class="site-footer">
            <p>Made with a little curiosity and a lot of code ✨</p>
        </footer>

    </div>

    <!-- About page scripts -->
    <script src="js/main.js"></script>
    <script src="js/aboutConstants.js"></script>
    <script src="js/journeyConstants.js"></script>
    <script src="js/about.js"></script>
</body>

</html>
